##################################################################################################
# BUILD args - will be passed into Dockerfile.rhtap and bundle.Dockerfile.rhtap in build pipelines
##################################################################################################

# VolSync version
ARG_VERSION=0.15.0
ARG_SUPPORTED_OCP_VERSIONS=v4.14-v4.22

# Mover versions
# These should match the versions in the drift-cache/volsync/Dockerfile.cached
ARG_RCLONE_VERSION=v1.73.1
ARG_RCLONE_GIT_HASH="c7dab94e94641a036e856b21782affd29fad2aab"

ARG_SYNCTHING_VERSION=v1.30.0
ARG_SYNCTHING_GIT_HASH="0945304a79d6bbaeac7fc2cc1b06f57d3cf66622"

ARG_DISKRSYNC_VERSION=v1.3.0
ARG_DISKRSYNC_GIT_HASH="507805c4378495fc2267b77f6eab3d6bb318c86c"

# Related images - will need to be kept updated with latest via component nudges
# See https://konflux.pages.redhat.com/docs/users/building/component-nudges.html
#
# Note:  do NOT surround these with "" as this does something strange with the output from bundle-hack/update-bundle.sh
ARG_STAGE_VOLSYNC_IMAGE_PULLSPEC=quay.io/redhat-user-workloads/volsync-tenant/volsync-0-15@sha256:a76214df85153fd69adb3b24923b4d12178fd539894869eb54e7904214ebd33e

#
# ACM 2.15 doclink
#
ARG_ACM_DOCLINK=https://docs.redhat.com/documentation/en-us/red_hat_advanced_cluster_management_for_kubernetes/2.16/html/business_continuity/business-cont-overview#volsync
